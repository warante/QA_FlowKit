version: 1
project:
  name: karate-target-fixture
  repoMode: qa-and-automation
  qaTrack: quick
  defaultLanguage: en
  interfaceLanguage: en
tools:
  testManagement: none
  issueTracker: none
  documentation: markdown
agents:
  specialistMode: auto
sources:
  main: markdown
knowledge:
  enabled: false
  sourcePath: ''
  summaryPath: qa-ai-output/qa-knowledge-summary.md
  decisionsPath: qa-ai-output/qa-init-decisions.md
requirements:
  requireOfficialRfId: true
  allowInferredAcceptanceCriteria: true
  requireApprovalForInferredCriteria: true
gherkin:
  language: en
  oneScenarioPerFile: true
  requireAcceptanceCriteria: true
  manualTestsNeedFeatureFile: true
  featurePath: features
  tags:
    required:
      - priority
      - type
      - manual
testrail:
  enabled: false
  projectName: ''
  allowCreateSections: false
  allowCreateCases: false
  allowUpdateCases: never
  allowDeleteCases: never
  mappingFile: ''
automation:
  ui:
    framework: karate
    specsPath: tests/karate/features/ui
    pageObjectsPath: ''
  api:
    framework: karate
    specsPath: tests/karate/features/api
  karate:
    configPath: tests/karate/karate-config.js
    mocksPath: tests/karate/mocks
    performancePath: tests/karate/performance
  strategy:
    automateAllTechnicallyPossible: true
    requireProposalBeforeImplementation: true
    allowModifyExistingTests: approval-only
traceability:
  matrixPath: qa-ai-output/traceability-matrix.md
approval:
  beforeExternalWrite: true
  beforeExistingFileModification: true
  beforeTestRailSync: true
  beforeJiraTaskCreation: true
  beforePullRequest: true
commands:
  testQA: node .qa-ai/scripts/validate-features.mjs
  testKarate: node .qa-ai/scripts/validate-karate-features.mjs
