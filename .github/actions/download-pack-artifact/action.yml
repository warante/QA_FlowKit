name: Download QA FlowKit pack artifact
description: Reuse npm pack tarball from the npm-pack CI job
runs:
  using: composite
  steps:
    - name: Download pack artifact
      uses: actions/download-artifact@v4
      with:
        name: qa-flowkit-pack
        path: pack-artifact

    - name: Set QA_FLOWKIT_PACK_TARBALL
      shell: bash
      run: |
        shopt -s nullglob
        files=(pack-artifact/*.tgz)
        if [ ${#files[@]} -eq 0 ]; then
          echo "No .tgz found in pack-artifact" >&2
          ls -la pack-artifact/ || true
          exit 1
        fi
        tarball="$(cd "$(dirname "${files[0]}")" && pwd)/$(basename "${files[0]}")"
        echo "QA_FLOWKIT_PACK_TARBALL=${tarball}" >> "$GITHUB_ENV"
