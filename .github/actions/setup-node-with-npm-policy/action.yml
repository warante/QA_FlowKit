name: Setup Node.js with npm release-age policy
description: >-
  Installs Node.js, upgrades npm to >= 11.10.0 so min-release-age from .npmrc is enforced,
  and verifies the repository policy configuration.
inputs:
  node-version:
    description: Node.js version to install
    required: true
  registry-url:
    description: Optional npm registry URL (for publish workflows)
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}

    - name: Upgrade npm for minimum release-age policy
      shell: bash
      run: npm install -g npm@^11.10.0

    - name: Verify npm minimum release-age policy
      shell: bash
      run: node .github/scripts/verify-npm-release-age-policy.mjs --check-npm-version
