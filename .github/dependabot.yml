version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 2

  - package-ecosystem: npm
    directory: /examples/playwright-full
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 2
