name: Release Please

# Primary release path: release-please opens/updates a Release PR from Conventional
# Commits on main. Merging that PR creates a GitHub Release + tag; the publish job
# then validates, packs, and publishes to npm (Trusted Publishing OIDC when configured).
#
# Uses the release-please CLI (devDependency) instead of googleapis/release-please-action
# because this repo restricts Actions to GitHub-owned or warante-owned actions only.

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Release Please (CLI)
        id: release
        run: node .github/scripts/run-release-please.mjs
        env:
          # Default GITHUB_TOKEN needs "Allow GitHub Actions to create pull requests"
          # in repo Settings → Actions → General. Optional override: RELEASE_PLEASE_TOKEN (PAT).
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  publish:
    name: Publish to npm
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PKG_VERSION: ${{ needs.release-please.outputs.version }}
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint and format check
        run: |
          npm run lint
          npm run format:check

      - name: Run pre-publish validation
        run: npm run validate:oss-extraction

      - name: Verify npm pack allowlist
        run: node .github/scripts/verify-npm-pack.mjs

      - name: Check version is not already on npm
        shell: bash
        run: |
          set -euo pipefail
          if npm view "qa-flowkit@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "::error::qa-flowkit@${PKG_VERSION} is already published."
            exit 1
          fi
          echo "Version ${PKG_VERSION} is not on npm yet; proceeding."

      - name: Resolve npm dist-tag
        id: dist_tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${PKG_VERSION}" == *-* ]]; then
            PRERELEASE_ID="${PKG_VERSION#*-}"
            PRERELEASE_ID="${PRERELEASE_ID%%.*}"
            echo "tag=${PRERELEASE_ID}" >> "${GITHUB_OUTPUT}"
            echo "Prerelease detected; using dist-tag: ${PRERELEASE_ID}"
          else
            echo "tag=latest" >> "${GITHUB_OUTPUT}"
            echo "Stable release; using dist-tag: latest"
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public --tag "${{ steps.dist_tag.outputs.tag }}"
        env:
          # Fallback when npm Trusted Publishing is not configured on npmjs.com yet.
          # Remove NPM_TOKEN secret after enabling Trusted Publisher for this workflow.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Post-publish verification
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${PKG_VERSION}" == *"-rc."* ]]; then
            echo "RC release detected; running full post-publish validation."
            node .github/scripts/run-rc-post-publish-validation.mjs --version "${PKG_VERSION}"
            exit 0
          fi
          if [[ "${PKG_VERSION}" != *-* ]]; then
            echo "Stable release detected; running full post-publish validation."
            node .github/scripts/run-stable-post-publish-validation.mjs --version "${PKG_VERSION}"
            exit 0
          fi
          # npm registry propagation can lag a few seconds after publish; retry before failing.
          PUBLISHED=""
          for attempt in 1 2 3 4 5 6; do
            if PUBLISHED=$(npm view "qa-flowkit@${PKG_VERSION}" version 2>/dev/null) && [[ -n "${PUBLISHED}" ]]; then
              break
            fi
            echo "Attempt ${attempt}: version not visible yet on npm; waiting 15s..."
            sleep 15
          done
          if [[ "${PUBLISHED}" != "${PKG_VERSION}" ]]; then
            echo "::error::npm view returned '${PUBLISHED}', expected ${PKG_VERSION}."
            exit 1
          fi
          echo "Published version confirmed: ${PUBLISHED}"

          VERIFY_DIR=$(mktemp -d)
          npm pack "qa-flowkit@${PKG_VERSION}" --pack-destination "${VERIFY_DIR}"
          TARBALL=$(ls "${VERIFY_DIR}"/qa-flowkit-*.tgz | head -n 1)
          npm install --prefix "${VERIFY_DIR}/install" --ignore-scripts --no-save "${TARBALL}"
          "${VERIFY_DIR}/install/node_modules/qa-flowkit/bin/qa-flowkit.mjs" version
          echo "Post-publish smoke install passed."
