name: Update Traceability from CI/CD

on:
  pull_request:
    types: [closed]
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to process (leave empty for latest merge)'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  update-traceability:
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Check for repository traceability matrix
        id: matrix
        shell: bash
        run: |
          if [ -f .qa-ai/output/traceability-matrix.md ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "No repository traceability matrix; nothing to update." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Determine PR number
        id: pr-info
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pr_number }}
          MERGED_PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PR_NUMBER="$INPUT_PR"
          else
            PR_NUMBER="$MERGED_PR"
          fi
          if [[ -n "$PR_NUMBER" && ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::PR number must be numeric"
            exit 1
          fi
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Update traceability matrix
        if: steps.matrix.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr-info.outputs.pr_number }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            node .github/scripts/update-traceability.mjs --pr "$PR_NUMBER"
          else
            node .github/scripts/update-traceability.mjs --since "1 day ago"
          fi

      - name: Check for changes
        id: git-check
        if: steps.matrix.outputs.available == 'true'
        run: |
          git diff --exit-code .qa-ai/output/traceability-matrix.md || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Upload updated matrix for review
        if: steps.git-check.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: updated-traceability-matrix
          path: .qa-ai/output/traceability-matrix.md
          if-no-files-found: error
          include-hidden-files: true

      - name: Create summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "## Traceability Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$JOB_STATUS" != "success" ]; then
            echo "❌ Traceability update failed; inspect the failing step" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.git-check.outputs.changed }}" = "true" ]; then
            echo "✅ Updated matrix uploaded for review; main was not modified" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No changes to traceability matrix" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**PR Number:** ${{ steps.pr-info.outputs.pr_number || 'N/A' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Event:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
