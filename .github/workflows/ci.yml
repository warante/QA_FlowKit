name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-pack:
    name: npm pack allowlist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js with npm release-age policy
        uses: ./.github/actions/setup-node-with-npm-policy
        with:
          node-version: '20'

      - name: Install dependencies
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm ci --ignore-scripts

      - name: Verify npm pack allowlist
        run: node .github/scripts/verify-npm-pack.mjs

      - name: Pack tarball for downstream jobs
        run: |
          mkdir -p pack-artifact
          npm pack --pack-destination pack-artifact --json > pack-artifact/pack.json
          ls -la pack-artifact/
          test -n "$(find pack-artifact -maxdepth 1 -name '*.tgz' -print -quit)" || {
            echo "No .tgz tarball found in pack-artifact after npm pack"
            exit 1
          }

      - name: Upload pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: qa-flowkit-pack
          path: pack-artifact/
          if-no-files-found: error
          retention-days: 1

  adapter-parity:
    name: adapter template parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify adapter parity
        run: node .github/scripts/verify-adapter-parity.mjs

  adapter-support:
    name: adapter support inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify adapter support manifest
        run: npm run test:adapter-support

  claude-plugin:
    name: Claude plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Check generated plugin drift
        run: node .github/scripts/build-claude-plugin.mjs --check

      - name: Validate Claude plugin
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate plugin/
          else
            echo "Claude CLI is not available; structural plugin validation already ran in build-claude-plugin.mjs --check."
          fi

  golden-target:
    name: golden target validate-target
    needs: npm-pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Run golden target validation
        run: node .github/scripts/run-golden-target-validation.mjs

  karate-target:
    name: karate target validate-target
    needs: npm-pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Run karate target validation
        run: node .github/scripts/run-karate-target-validation.mjs

  karate-example:
    name: 'Karate example (${{ matrix.os }})'
    needs: npm-pack
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/download-pack-artifact

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate and execute Karate public example
        run: npm run test:e2e-karate -- --runtime

  playwright-example:
    name: 'Playwright example (${{ matrix.os }})'
    needs: npm-pack
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/download-pack-artifact

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Validate and execute Playwright UI + API example
        run: npm run test:e2e-playwright -- --runtime

  mobile-example:
    name: 'Maestro + Karate mobile example (${{ matrix.os }})'
    needs: npm-pack
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/download-pack-artifact

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Maestro flows and execute Karate API example
        run: npm run test:e2e-mobile -- --runtime

  quick-path:
    name: 'Quick path (${{ matrix.os }}, Node ${{ matrix.node }})'
    needs: npm-pack
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/download-pack-artifact

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Run deterministic five-minute quick path
        run: npm run test:e2e-quick

  manual-example:
    name: 'Manual example (${{ matrix.os }}, Node ${{ matrix.node }})'
    needs: npm-pack
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/download-pack-artifact

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Validate packed manual-only public example
        run: npm run test:e2e-manual-example

  update-migration:
    name: 'Update migration (${{ matrix.os }}, Node ${{ matrix.node }})'
    needs: npm-pack
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/download-pack-artifact

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Run beta-to-1.0 update migration validation
        run: npm run test:e2e-update-migration

  clean-install:
    name: 'Clean install (${{ matrix.os }}, Node ${{ matrix.node }})'
    needs: npm-pack
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/download-pack-artifact

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Run packed clean-install validation (E2E-06)
        run: npm run test:e2e-clean-install

  adversarial-failure:
    name: 'Adversarial failure paths (${{ matrix.os }}, Node ${{ matrix.node }})'
    needs: npm-pack
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/download-pack-artifact

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Run adversarial failure-path validation (E2E-08)
        run: npm run test:e2e-adversarial

  release-dry-run:
    name: Release dry-run (E2E-09)
    needs: npm-pack
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/download-pack-artifact

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Run release dry-run validation
        run: npm run test:e2e-release-dry-run

  stable-config-rehearsal:
    name: Stable config rehearsal (TASK-083)
    needs: npm-pack
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/download-pack-artifact

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Run stable config rehearsal
        run: npm run test:e2e-stable-config-rehearsal

  stable-release-pr-rehearsal:
    name: Stable Release PR rehearsal (TASK-084)
    needs: npm-pack
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Run stable Release PR rehearsal
        run: npm run test:e2e-stable-release-pr-rehearsal

  # Ruleset "Protect release branches" requires check context "Validate starter" (not matrix names).
  validate-starter:
    name: Validate starter
    needs:
      [
        npm-pack,
        adapter-parity,
        adapter-support,
        claude-plugin,
        golden-target,
        karate-target,
        karate-example,
        playwright-example,
        mobile-example,
        quick-path,
        manual-example,
        update-migration,
        clean-install,
        adversarial-failure,
        release-dry-run,
        stable-config-rehearsal,
        stable-release-pr-rehearsal
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js with npm release-age policy
        uses: ./.github/actions/setup-node-with-npm-policy
        with:
          node-version: '20'

      - name: Check dependency policy
        run: node .github/scripts/verify-dependency-policy.mjs

      - name: Install dependencies
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm audit --audit-level=low

      - name: Check script syntax
        run: node .github/scripts/check-syntax.mjs

      - name: Lint
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm run lint

      - name: Format check
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm run format:check

      - name: Run starter validation and smoke tests
        run: npm run validate:core

  coverage:
    name: Coverage
    needs: npm-pack
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js with npm release-age policy
        uses: ./.github/actions/setup-node-with-npm-policy
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check validator and harness coverage
        run: npm run coverage:check

  validate:
    name: 'Validate (${{ matrix.os }}, Node ${{ matrix.node }})'
    needs:
      [
        npm-pack,
        adapter-parity,
        adapter-support,
        claude-plugin,
        golden-target,
        karate-target,
        karate-example,
        playwright-example,
        mobile-example,
        quick-path,
        manual-example,
        update-migration,
        clean-install,
        adversarial-failure,
        release-dry-run,
        stable-config-rehearsal,
        stable-release-pr-rehearsal
      ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
          - os: windows-latest
            node: '20'
          - os: windows-latest
            node: '22'

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js with npm release-age policy
        uses: ./.github/actions/setup-node-with-npm-policy
        with:
          node-version: ${{ matrix.node }}

      - name: Check dependency policy
        run: node .github/scripts/verify-dependency-policy.mjs

      - name: Install dependencies
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm audit --audit-level=low

      - name: Check script syntax
        run: node .github/scripts/check-syntax.mjs

      - name: Lint
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm run lint

      - name: Format check
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm run format:check

      - name: Run starter validation and smoke tests
        run: npm run validate:core
