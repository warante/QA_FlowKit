name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  npm-pack:
    name: npm pack allowlist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm ci --ignore-scripts

      - name: Verify npm pack allowlist
        run: node .github/scripts/verify-npm-pack.mjs

  adapter-parity:
    name: adapter template parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify adapter parity
        run: node .github/scripts/verify-adapter-parity.mjs

  golden-target:
    name: golden target validate-target
    needs: npm-pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Run golden target validation
        run: node .github/scripts/run-golden-target-validation.mjs

  karate-target:
    name: karate target validate-target
    needs: npm-pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Run karate target validation
        run: node .github/scripts/run-karate-target-validation.mjs

  karate-example:
    name: 'Karate example (${{ matrix.os }})'
    needs: npm-pack
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate and execute Karate public example
        run: npm run test:e2e-karate -- --runtime

  playwright-example:
    name: 'Playwright example (${{ matrix.os }})'
    needs: npm-pack
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Validate and execute Playwright UI + API example
        run: npm run test:e2e-playwright -- --runtime

  mobile-example:
    name: 'Maestro + Karate mobile example (${{ matrix.os }})'
    needs: npm-pack
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Maestro flows and execute Karate API example
        run: npm run test:e2e-mobile -- --runtime

  quick-path:
    name: 'Quick path (${{ matrix.os }}, Node ${{ matrix.node }})'
    needs: npm-pack
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Run deterministic five-minute quick path
        run: npm run test:e2e-quick

  manual-example:
    name: 'Manual example (${{ matrix.os }}, Node ${{ matrix.node }})'
    needs: npm-pack
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Validate packed manual-only public example
        run: npm run test:e2e-manual-example

  # Ruleset "Protect release branches" requires check context "Validate starter" (not matrix names).
  validate-starter:
    name: Validate starter
    needs:
      [
        npm-pack,
        adapter-parity,
        golden-target,
        karate-target,
        karate-example,
        playwright-example,
        mobile-example,
        quick-path,
        manual-example
      ]
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Check dependency policy
        run: |
          node -e "
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const dependencyGroups = [
            'dependencies',
            'devDependencies',
            'optionalDependencies',
            'peerDependencies'
          ];
          const dependencies = dependencyGroups.flatMap((group) =>
            Object.entries(pkg[group] || {}).map(([name, spec]) => ({ group, name, spec: String(spec) }))
          );
          const unsafeSpecs = dependencies.filter(({ spec }) => /^(?:git\+?|https?:|file:|link:)/i.test(spec));
          if (unsafeSpecs.length > 0) {
            console.error('Unsafe dependency specifiers are not allowed in this portable starter:');
            for (const item of unsafeSpecs) console.error('- ' + item.group + '.' + item.name + ': ' + item.spec);
            process.exit(1);
          }
          if (dependencies.length === 0) {
            console.log('No package dependencies declared; npm audit is not required.');
            process.exit(0);
          }
          if (!fs.existsSync('package-lock.json')) {
            console.error('Dependencies are declared, but package-lock.json is missing.');
            console.error('Add a committed lockfile so CI can run npm ci and npm audit reproducibly.');
            process.exit(1);
          }
          console.log('Dependency policy passed for ' + dependencies.length + ' declared dependencies.');
          "

      - name: Install dependencies
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm audit --audit-level=low

      - name: Check documentation consistency
        run: npm run docs:check

      - name: Check script syntax
        run: node .github/scripts/check-syntax.mjs

      - name: Lint
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm run lint

      - name: Format check
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm run format:check

      - name: Run starter validation and smoke tests
        run: npm run validate:oss-extraction

  validate:
    name: 'Validate (${{ matrix.os }}, Node ${{ matrix.node }})'
    needs:
      [
        npm-pack,
        adapter-parity,
        golden-target,
        karate-target,
        karate-example,
        playwright-example,
        mobile-example,
        quick-path,
        manual-example
      ]
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
          - os: windows-latest
            node: '20'
          - os: windows-latest
            node: '22'

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Check dependency policy
        run: |
          node -e "
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const dependencyGroups = [
            'dependencies',
            'devDependencies',
            'optionalDependencies',
            'peerDependencies'
          ];
          const dependencies = dependencyGroups.flatMap((group) =>
            Object.entries(pkg[group] || {}).map(([name, spec]) => ({ group, name, spec: String(spec) }))
          );
          const unsafeSpecs = dependencies.filter(({ spec }) => /^(?:git\+?|https?:|file:|link:)/i.test(spec));
          if (unsafeSpecs.length > 0) {
            console.error('Unsafe dependency specifiers are not allowed in this portable starter:');
            for (const item of unsafeSpecs) console.error('- ' + item.group + '.' + item.name + ': ' + item.spec);
            process.exit(1);
          }
          if (dependencies.length === 0) {
            console.log('No package dependencies declared; npm audit is not required.');
            process.exit(0);
          }
          if (!fs.existsSync('package-lock.json')) {
            console.error('Dependencies are declared, but package-lock.json is missing.');
            console.error('Add a committed lockfile so CI can run npm ci and npm audit reproducibly.');
            process.exit(1);
          }
          console.log('Dependency policy passed for ' + dependencies.length + ' declared dependencies.');
          "

      - name: Install dependencies
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm audit --audit-level=low

      - name: Check documentation consistency
        run: npm run docs:check

      - name: Check script syntax
        run: node .github/scripts/check-syntax.mjs

      - name: Lint
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm run lint

      - name: Format check
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm run format:check

      - name: Run starter validation and smoke tests
        run: npm run validate:oss-extraction
